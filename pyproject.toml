[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keel"
version = "0.2.0"
description = "Turn a vague software project idea into an agent-ready markdown prompt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "anthropic>=0.40",
    "groq>=1.6",
    "ollama>=0.6",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["keel*"]

[tool.setuptools.package-data]
keel = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
