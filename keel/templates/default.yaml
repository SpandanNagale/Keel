name: default
title: General software project
description: >-
  Fallback template for any idea that does not clearly read as a CLI tool, a data
  pipeline, or a web API.

slots:
  - name: io_contract
    section: io_contract
    label: Input / output contract
    required: true
    priority: 1
    question_hint: "What goes in, what comes out, and in what format?"
    default_text: "Reads the local files or inputs named in the idea and writes a single structured output file (JSON or plain text) alongside them."
    default_strategy: >-
      State the most literal input/output pair the idea implies. Name concrete
      formats (JSON, CSV, plain text, stdout). Prefer formats that need no new
      infrastructure. One or two sentences.

  - name: runtime
    section: context
    label: Runtime
    required: true
    priority: 2
    question_hint: "Where does this run — a one-off CLI command, a cron job, a long-running server, a notebook, or interactively?"
    default_text: "A one-off script run manually from the developer's machine."
    default_strategy: >-
      Pick the single simplest runtime the idea implies (manual local script
      unless it mentions scheduling or serving). One sentence. Do not list
      alternatives.

  - name: scale
    section: context
    label: Scale
    required: true
    priority: 3
    question_hint: "What volume, frequency, and data size should this handle?"
    default_text: "A single user running it occasionally over a small local dataset — tens to low thousands of items."
    default_strategy: >-
      Give a concrete order-of-magnitude estimate for volume, frequency, and
      data size, based on what the idea implies. One sentence. Assume small and
      single-user unless the idea says otherwise.

  - name: constraints
    section: constraints
    label: Hard constraints
    required: true
    priority: 4
    question_hint: "Any hard limits — offline only, no paid APIs, a required language, existing dependencies to reuse or avoid?"
    default_text: "No paid APIs, minimal network use, Python with only widely-used libraries, and no new services to stand up."
    default_strategy: >-
      List the hard limits the idea implies as short phrases in one
      sentence (language, offline, no paid APIs, dependency limits). If the idea
      implies none, state the conservative default: Python, no paid APIs, no new
      infrastructure.

  - name: non_goals
    section: non_goals
    label: Non-goals
    required: true
    priority: 5
    question_hint: "What should the agent explicitly NOT build — auth, a database, a UI, a config system, a test suite, packaging?"
    default_text: "No authentication, no database, no web or desktop UI, no packaging for distribution, and no exhaustive test suite — just the working core."
    default_strategy: >-
      List 3-5 concrete things the agent should NOT build, drawn from the usual
      over-engineering traps for this kind of idea (auth, database, UI, config
      system, plugin system, packaging, broad test suite). Name them explicitly.

  - name: done
    section: acceptance
    label: Definition of done
    required: true
    priority: 6
    question_hint: "How will you know it works — what is the observable signal?"
    default_text: "Running it once against real or sample input produces the expected output with no errors, and the output is spot-checked by hand."
    default_strategy: >-
      Describe one concrete, observable check that proves the tool works — a
      command to run and what its output should look like. One or two sentences.

  - name: data_model
    section: io_contract
    label: Core data model
    required: false
    priority: 7
    question_hint: "What are the main entities and the fields each one carries?"
    default_text: "One core record type holding the fields named or implied by the idea, kept in memory or a single local file; no relational schema and no migrations."
    default_strategy: >-
      Name the one or two core entities the idea implies and list the concrete
      fields each carries, with a rough type. Stay within what the idea
      supports; do not invent a schema.

  - name: interfaces
    section: io_contract
    label: Interface surface
    required: false
    priority: 8
    question_hint: "What are the exact functions, commands, or screens, and what does each take and return?"
    default_text: "A single entry point — one function or one command — that takes the input the idea describes and returns the output it describes. No other surface."
    default_strategy: >-
      Enumerate every function, command, endpoint, or screen the idea implies.
      For each, give its inputs and its output on one line. Do not add surfaces
      the idea does not call for.

  - name: error_handling
    section: constraints
    label: Error handling
    required: false
    priority: 9
    question_hint: "What should happen on bad input, a missing file, or a partial failure?"
    default_text: "Invalid or missing input stops with a clear message and a non-zero exit; a partial failure halts and reports what completed, leaving no half-written output behind."
    default_strategy: >-
      State what happens on bad input, on a missing or unreadable resource, and
      on a partial failure. Name the observable behaviour — message, exit code,
      no partial output. One or two sentences.
