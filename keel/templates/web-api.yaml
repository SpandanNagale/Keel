name: web-api
title: Web API / HTTP service
description: >-
  An HTTP service: defined routes, JSON request and response bodies, run as a
  server process.

slots:
  - name: io_contract
    section: io_contract
    label: Endpoints and request / response contract
    required: true
    priority: 1
    question_hint: "What routes and methods should exist, and what does each one accept and return?"
    default_text: "A minimal set of endpoints implied by the idea — typically one POST to submit input and one GET to retrieve a result. Requests and responses are JSON; every response carries a status field alongside the result payload."
    default_strategy: >-
      List the specific routes (method + path) the idea implies, and for each,
      the request body and the success response body. JSON on both sides. Two
      or three sentences.

  - name: runtime
    section: context
    label: Runtime
    required: true
    priority: 2
    question_hint: "How is this served — locally via the framework's dev server, or deployed to something specific?"
    default_text: "Runs locally via the framework's built-in dev server (for example uvicorn); no specific deployment target."
    default_strategy: >-
      State how the service is run and whether a deployment target is named,
      based on the idea. One sentence. Default to the local dev server.

  - name: scale
    section: context
    label: Scale
    required: true
    priority: 3
    question_hint: "Expected request volume and concurrency — a few requests a day, or real production traffic?"
    default_text: "Low traffic — single-digit requests per second at most, one instance, no horizontal scaling or load balancing."
    default_strategy: >-
      Give expected requests per second, concurrency, and instance count, based
      on the idea. One sentence. Assume low single-instance traffic unless the
      idea says otherwise.

  - name: constraints
    section: constraints
    label: Hard constraints
    required: true
    priority: 4
    question_hint: "Any hard limits — a required framework or language, no paid APIs, no database, existing dependencies?"
    default_text: "Python with FastAPI, no paid APIs, in-memory or single-file storage rather than a database server, and no auth layer."
    default_strategy: >-
      List the hard limits the idea implies (framework, language, storage, paid
      APIs, auth). One or two sentences. Default to Python + FastAPI with
      in-memory storage.

  - name: non_goals
    section: non_goals
    label: Non-goals
    required: true
    priority: 5
    question_hint: "What should the agent explicitly NOT build — authentication, a persistent database, rate limiting, a frontend, deployment config?"
    default_text: "No authentication or user accounts, no persistent database, no rate limiting, no frontend, and no deployment or CI config — just the endpoints."
    default_strategy: >-
      List 3-5 things the agent should NOT build for an API (auth, database,
      rate limiting, frontend, deployment config, API versioning). Name them
      explicitly.

  - name: done
    section: acceptance
    label: Definition of done
    required: true
    priority: 6
    question_hint: "How will you know the API works — a manual curl, a smoke test, specific responses to check?"
    default_text: "Starting the server and hitting each endpoint with a sample request (curl or the framework's test client) returns the documented response shape with a 2xx status."
    default_strategy: >-
      Describe one concrete check: the request to send to each endpoint and the
      response shape and status code expected back. One or two sentences.

  - name: data_model
    section: io_contract
    label: Resource schemas
    required: false
    priority: 7
    question_hint: "What are the resources the API exposes, and what fields does each carry?"
    default_text: "One or two resources implied by the idea, each a flat JSON object with the fields the idea names plus an id and a created timestamp. No relational joins."
    default_strategy: >-
      List each resource the API exposes and the fields it carries, with rough
      JSON types. Use only what the idea names, plus an id. Two or three
      sentences.

  - name: interfaces
    section: io_contract
    label: Full endpoint list
    required: false
    priority: 8
    question_hint: "What is the complete list of routes — method and path — and the request and response body of each?"
    default_text: "The full set of routes the idea implies, each as method + path with its JSON request body and its JSON success response. Typically a create (POST), a fetch (GET by id), and a list (GET)."
    default_strategy: >-
      Enumerate every route as method + path. For each, give the request body
      and the success response body, JSON on both sides. List all of them, not
      one example.

  - name: error_handling
    section: constraints
    label: Error responses
    required: false
    priority: 9
    question_hint: "What does the API return on a malformed body, a missing resource, or an unexpected server error?"
    default_text: "A malformed or invalid body returns 400 with a JSON error object naming the bad fields; a missing resource returns 404; an unexpected failure returns 500 with a generic message and no stack trace in the body."
    default_strategy: >-
      State the status code and response body for a malformed request, a
      not-found resource, and an unexpected server error. JSON error shape. One
      or two sentences.
