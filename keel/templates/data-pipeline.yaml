name: data-pipeline
title: Data pipeline
description: >-
  Moves and reshapes data: reads from a source, transforms records, writes to a
  destination. Batch or streaming.

slots:
  - name: io_contract
    section: io_contract
    label: Source, destination, and record shape
    required: true
    priority: 1
    question_hint: "What is the data source and the destination, and what does one input record look like versus one output record?"
    why_this_matters: >-
      This pins down where the data comes from, where it goes, and how one
      record changes shape in between. An agent builds every stage around this,
      so a vague answer here makes the whole pipeline vague.
    default_text: "Reads from the local files or documented source named in the idea, transforms each record, and writes results to a single structured local file (JSON Lines or CSV). One output record per input item, carrying only the fields the idea names."
    default_strategy: >-
      Name the source, the destination, and the format on each side. Sketch the
      minimal input record and output record using only fields the idea names.
      Two or three sentences.

  - name: runtime
    section: context
    label: Runtime
    required: true
    priority: 2
    question_hint: "Where does this run — a manual script, a cron job, or an orchestrator like Airflow, Dagster, or Prefect?"
    why_this_matters: >-
      How the pipeline is triggered shapes it: a script you run when you have
      new input needs no infrastructure, a scheduled batch must track what it
      already processed, and an event-triggered one must cope with half-finished
      runs.
    default_text: "A manually invoked local script — no scheduler and no orchestrator."
    default_strategy: >-
      State whether the pipeline is run manually, on cron, or under an
      orchestrator, based on the idea. One sentence. Default to a manual local
      script unless the idea names a schedule.
    choices:
      - label: "Run by hand"
        plain_language: "You start the run yourself when there is new input to process."
        tradeoff: "No infrastructure at all; nothing runs unless you run it."
        value: "A manually invoked local script; no scheduler and no orchestrator."
      - label: "A scheduled batch"
        plain_language: "It runs on a timetable and picks up whatever is new since last time."
        tradeoff: "Runs unattended, but needs an always-on host and a record of what it already handled."
        value: "Runs on a schedule on an always-on host, processing whatever is new since the last successful run (which it tracks)."
      - label: "Triggered by new data"
        plain_language: "It runs when a file lands or an upstream job finishes."
        tradeoff: "Most responsive, but needs a trigger mechanism and careful handling of interrupted runs."
        value: "Triggered by an event (a new file or an upstream completion); each run is idempotent and safe to retry after an interruption."

  - name: scale
    section: context
    label: Scale
    required: true
    priority: 3
    question_hint: "How much data, how often — a one-time backfill, an hourly batch, a stream — and roughly how many records?"
    why_this_matters: >-
      Volume and frequency decide whether one in-memory pass is safe or whether
      you need chunking, incremental state, or a streaming design. Guessing high
      wastes effort; guessing low forces a rewrite. A rough record count is
      enough.
    default_text: "A one-time or on-demand batch over a small-to-moderate dataset — hundreds to low tens of thousands of records — not a continuous stream."
    default_strategy: >-
      Give volume (record count), frequency (one-off / hourly / streaming), and
      data size, based on the idea. One or two sentences. Assume a bounded batch
      unless the idea implies a stream.
    choices:
      - label: "A bounded batch"
        plain_language: "Hundreds to tens of thousands of records, run once or on demand."
        tradeoff: "Fits in memory; a single straightforward pass is enough."
        value: "A one-time or on-demand batch of hundreds to low tens of thousands of records, processed in a single in-memory pass."
      - label: "A recurring batch"
        plain_language: "A steady flow — say hourly or daily — of moderate size each time."
        tradeoff: "Needs to remember where it left off and avoid reprocessing everything."
        value: "A recurring batch (hourly or daily) of moderate size, processing only records new or changed since the last run."
      - label: "Large or continuous"
        plain_language: "Hundreds of thousands per run, or a never-ending stream."
        tradeoff: "Must process incrementally as a stream; a noticeably bigger build."
        value: "Hundreds of thousands of records per run or a continuous stream; processed incrementally with flat memory use."

  - name: constraints
    section: constraints
    label: Hard constraints
    required: true
    priority: 4
    question_hint: "Any hard limits — offline only, no paid APIs, source rate limits to respect, a required language, existing dependencies?"
    why_this_matters: >-
      Hard limits — offline only, no paid services, source rate limits to
      respect, a required language, no new datastore to provision — rule options
      in or out before any design. "No unusual limits" is a fine answer.
    default_text: "No paid APIs, respect obvious rate limits on the source, Python with pandas or the standard library, and no new datastore to provision."
    default_strategy: >-
      List the hard limits the idea implies (language, offline, paid APIs, rate
      limits, datastore). One or two sentences. Default to Python, no paid APIs,
      no new infrastructure.
    choices:
      - label: "Keep it minimal"
        plain_language: "Standard library plus one or two well-known packages; no paid services; no new datastore."
        tradeoff: "Easy to install and run anywhere; you write more of the plumbing yourself."
        value: "Standard library plus one or two widely-used packages; no paid services; writes to a local file, no new datastore to provision."
      - label: "A mainstream data stack"
        plain_language: "A common data library (such as pandas) and its usual companions are fine."
        tradeoff: "Less code to write; a heavier install and more dependencies to track."
        value: "A mainstream data library and its common companions are acceptable; still no paid services and no managed infrastructure."
      - label: "No hard limits"
        plain_language: "Any reputable library is fine, and free-tier hosted services are acceptable."
        tradeoff: "Fewest limits on the build; more moving parts and some lock-in."
        value: "No hard constraints beyond good sense — any reputable open-source library and free-tier services may be used."

  - name: non_goals
    section: non_goals
    label: Non-goals
    required: true
    priority: 5
    question_hint: "What should the agent explicitly NOT build — a scheduler, retry/backoff logic, a database, monitoring and alerting, a dashboard?"
    why_this_matters: >-
      Naming what NOT to build stops an agent adding a scheduler, a retry
      framework, a database, or monitoring you never asked for. Each non-goal
      should be a concrete thing an agent might otherwise build unprompted.
    default_text: "No scheduler, no retry/backoff framework, no database, no monitoring or alerting, and no dashboard — one reliable pass over the data is enough."
    default_strategy: >-
      List 3-5 things the agent should NOT build for a pipeline (scheduler,
      retry framework, database, monitoring, alerting, dashboard, CDC). Name
      them explicitly.

  - name: done
    section: acceptance
    label: Definition of done
    required: true
    priority: 6
    question_hint: "How will you know the pipeline ran correctly — record counts, spot checks, a validation step?"
    why_this_matters: >-
      The observable signal the run was correct — a record count that matches,
      a set of spot-checked records, a validation step that passes. Without it,
      "it ran" and "it ran correctly" are indistinguishable. It becomes the
      acceptance criteria.
    default_text: "One run produces the output with a record count that roughly matches the input, and a handful of spot-checked records have the right fields and values."
    default_strategy: >-
      Describe one concrete post-run check: what to count, what to spot-check,
      and what "correct" looks like. One or two sentences.

  - name: data_model
    section: io_contract
    label: Input and output record schema
    required: false
    priority: 7
    question_hint: "What fields does one input record carry, and what fields does one output record carry?"
    why_this_matters: >-
      The exact fields on one input record and one output record, and the key
      that links them. An agent needs this to parse the source and write the
      destination correctly. Use only what the idea and source imply.
    default_text: "The input record carries the fields the source already provides; the output record carries only the fields the idea names, plus a stable identifier. No nested structures unless the source has them."
    default_strategy: >-
      List the fields of one input record and one output record, with rough
      types, using only what the idea and source imply. Note the key that links
      them. Two or three sentences.

  - name: interfaces
    section: io_contract
    label: Entry point and stages
    required: false
    priority: 8
    question_hint: "How is the pipeline invoked, and what are its distinct stages from source to destination?"
    why_this_matters: >-
      The entry point and the ordered stages from source to destination, each
      with what it consumes and produces. Spelling them out is what lets an
      agent build the pass step by step rather than as one opaque blob.
    default_text: "One command or script entry point that runs the whole pass: read from the source, transform each record, write to the destination. Stages are internal, not separately invokable."
    default_strategy: >-
      Name the entry point (command or function) and list the ordered stages
      from source to destination. One line per stage: what it consumes and what
      it produces. Do not invent an orchestration layer.

  - name: error_handling
    section: constraints
    label: Error handling
    required: false
    priority: 9
    question_hint: "What happens on a malformed record, an unreachable source, or a failure midway through the batch?"
    why_this_matters: >-
      What happens on a malformed record (skip-and-count or abort), an
      unreachable source, and a mid-batch failure — including what state the
      destination is left in. Deciding this up front prevents both silent data
      loss and an over-built recovery layer.
    default_text: "A malformed record is skipped and counted in a summary rather than aborting the run; an unreachable source fails fast with a clear message; a mid-batch failure leaves the destination unchanged or clearly marked incomplete."
    default_strategy: >-
      State the behaviour on a malformed record (skip-and-count vs abort), an
      unreachable source, and a mid-batch failure — including what state the
      destination is left in. One or two sentences.

  - name: auth_model
    section: constraints
    label: Sign-in and accounts
    required: false
    priority: 10
    skip_if: "non_goals excludes authentication"
    question_hint: "Do people sign in, and how — no login, a password with sessions, a password with tokens, or an outside account provider?"
    why_this_matters: >-
      Whether people log in, and how, shapes the data model (a users table), the
      routes (sign in, sign out), and every screen that shows personal data.
      Deciding it up front avoids bolting authentication on later. Keel records
      the policy only — never a hashing algorithm, an iteration count, or a token
      lifetime.
    default_text: "No sign-in and no user accounts — everyone using it sees the same data."
    default_strategy: >-
      State the sign-in policy the idea implies in plain terms: no login,
      password with server-side sessions, password with signed tokens, or an
      external account provider. Never name a hashing algorithm, an iteration
      count, or a token lifetime. One sentence.
    choices:
      - label: "No sign-in"
        plain_language: "Anyone with the link can use it; there are no accounts."
        tradeoff: "Nothing to build; everyone sees the same data and the same actions."
        value: "No sign-in and no user accounts; everyone using it has the same access to the same data."
      - label: "Password login, server sessions"
        plain_language: "People sign in with a password and the server remembers them with a session cookie."
        tradeoff: "Standard for a server-rendered app; needs a users table, sign-in and sign-out pages, and per-user data."
        value: "Password sign-in with server-side sessions kept in a cookie; a users table and sign-in / sign-out routes; data scoped per user. No security parameters are specified here."
      - label: "Password login, signed tokens"
        plain_language: "People sign in and the app holds a token it sends with every request."
        tradeoff: "Fits an API or a single-page app; the client has to store the token and refresh it."
        value: "Password sign-in issuing a signed token the client sends on each request; a users table and a sign-in route; the client stores and refreshes the token. No security parameters are specified here."
      - label: "Use an existing account"
        plain_language: "People sign in with an account they already have (Google, GitHub, and the like) instead of a new password."
        tradeoff: "No passwords to store; depends on an outside provider being reachable and configured."
        value: "Sign-in delegated to an external account provider (OAuth / OpenID Connect); the app stores only a provider id and basic profile per user. No provider is chosen here."

  - name: seed_data
    section: constraints
    label: Starting data
    required: false
    priority: 11
    question_hint: "Does it ship with any data — empty, a few examples, a full sample set, or loaded from a file on first run?"
    why_this_matters: >-
      Whether the project ships with data decides what a fresh install looks
      like and how you demo or test it. It is a small choice, but an agent
      otherwise guesses — sometimes inventing records that look real.
    default_text: "Ships empty; the first user creates all the data."
    default_strategy: >-
      State whether the project ships with data: empty, a few clearly-fake
      examples, a full sample dataset, or imported from a file on first run. One
      sentence. Default to empty unless the idea implies otherwise.
    choices:
      - label: "Ship empty"
        plain_language: "It starts with no data; the first user adds everything."
        tradeoff: "Nothing to prepare; a new install looks blank until someone uses it."
        value: "Ships with no data; the first user creates every record."
      - label: "A few examples"
        plain_language: "A handful of obviously-fake sample rows so it is not empty on first run."
        tradeoff: "Good for a demo; the examples must be clearly fake and easy to delete."
        value: "Ships with a handful of clearly-labelled example records, easy to delete, so the app is not blank on first run."
      - label: "A full sample set"
        plain_language: "A realistic body of data loaded at setup."
        tradeoff: "Best for trying features at a realistic size; larger, and must not be mistaken for real data."
        value: "Ships with a full sample dataset loaded at setup, clearly marked as sample data, for realistic testing."
      - label: "Load from a file"
        plain_language: "It imports a data file you provide the first time it runs."
        tradeoff: "Flexible; you have to produce and keep that file up to date."
        value: "Imports its initial data from a file provided on first run; ships with none of its own."
