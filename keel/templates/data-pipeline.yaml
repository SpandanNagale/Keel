name: data-pipeline
title: Data pipeline
description: >-
  Moves and reshapes data: reads from a source, transforms records, writes to a
  destination. Batch or streaming.

slots:
  - name: io_contract
    section: io_contract
    label: Source, destination, and record shape
    required: true
    priority: 1
    question_hint: "What is the data source and the destination, and what does one input record look like versus one output record?"
    default_text: "Reads from the local files or documented source named in the idea, transforms each record, and writes results to a single structured local file (JSON Lines or CSV). One output record per input item, carrying only the fields the idea names."
    default_strategy: >-
      Name the source, the destination, and the format on each side. Sketch the
      minimal input record and output record using only fields the idea names.
      Two or three sentences.

  - name: runtime
    section: context
    label: Runtime
    required: true
    priority: 2
    question_hint: "Where does this run — a manual script, a cron job, or an orchestrator like Airflow, Dagster, or Prefect?"
    default_text: "A manually invoked local script — no scheduler and no orchestrator."
    default_strategy: >-
      State whether the pipeline is run manually, on cron, or under an
      orchestrator, based on the idea. One sentence. Default to a manual local
      script unless the idea names a schedule.

  - name: scale
    section: context
    label: Scale
    required: true
    priority: 3
    question_hint: "How much data, how often — a one-time backfill, an hourly batch, a stream — and roughly how many records?"
    default_text: "A one-time or on-demand batch over a small-to-moderate dataset — hundreds to low tens of thousands of records — not a continuous stream."
    default_strategy: >-
      Give volume (record count), frequency (one-off / hourly / streaming), and
      data size, based on the idea. One or two sentences. Assume a bounded batch
      unless the idea implies a stream.

  - name: constraints
    section: constraints
    label: Hard constraints
    required: true
    priority: 4
    question_hint: "Any hard limits — offline only, no paid APIs, source rate limits to respect, a required language, existing dependencies?"
    default_text: "No paid APIs, respect obvious rate limits on the source, Python with pandas or the standard library, and no new datastore to provision."
    default_strategy: >-
      List the hard limits the idea implies (language, offline, paid APIs, rate
      limits, datastore). One or two sentences. Default to Python, no paid APIs,
      no new infrastructure.

  - name: non_goals
    section: non_goals
    label: Non-goals
    required: true
    priority: 5
    question_hint: "What should the agent explicitly NOT build — a scheduler, retry/backoff logic, a database, monitoring and alerting, a dashboard?"
    default_text: "No scheduler, no retry/backoff framework, no database, no monitoring or alerting, and no dashboard — one reliable pass over the data is enough."
    default_strategy: >-
      List 3-5 things the agent should NOT build for a pipeline (scheduler,
      retry framework, database, monitoring, alerting, dashboard, CDC). Name
      them explicitly.

  - name: done
    section: acceptance
    label: Definition of done
    required: true
    priority: 6
    question_hint: "How will you know the pipeline ran correctly — record counts, spot checks, a validation step?"
    default_text: "One run produces the output with a record count that roughly matches the input, and a handful of spot-checked records have the right fields and values."
    default_strategy: >-
      Describe one concrete post-run check: what to count, what to spot-check,
      and what "correct" looks like. One or two sentences.

  - name: data_model
    section: io_contract
    label: Input and output record schema
    required: false
    priority: 7
    question_hint: "What fields does one input record carry, and what fields does one output record carry?"
    default_text: "The input record carries the fields the source already provides; the output record carries only the fields the idea names, plus a stable identifier. No nested structures unless the source has them."
    default_strategy: >-
      List the fields of one input record and one output record, with rough
      types, using only what the idea and source imply. Note the key that links
      them. Two or three sentences.

  - name: interfaces
    section: io_contract
    label: Entry point and stages
    required: false
    priority: 8
    question_hint: "How is the pipeline invoked, and what are its distinct stages from source to destination?"
    default_text: "One command or script entry point that runs the whole pass: read from the source, transform each record, write to the destination. Stages are internal, not separately invokable."
    default_strategy: >-
      Name the entry point (command or function) and list the ordered stages
      from source to destination. One line per stage: what it consumes and what
      it produces. Do not invent an orchestration layer.

  - name: error_handling
    section: constraints
    label: Error handling
    required: false
    priority: 9
    question_hint: "What happens on a malformed record, an unreachable source, or a failure midway through the batch?"
    default_text: "A malformed record is skipped and counted in a summary rather than aborting the run; an unreachable source fails fast with a clear message; a mid-batch failure leaves the destination unchanged or clearly marked incomplete."
    default_strategy: >-
      State the behaviour on a malformed record (skip-and-count vs abort), an
      unreachable source, and a mid-batch failure — including what state the
      destination is left in. One or two sentences.
